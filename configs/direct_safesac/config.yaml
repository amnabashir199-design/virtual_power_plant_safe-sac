training: {algorithm: SAC, total_timesteps: 100000, learning_rate: 0.0003, buffer_size: 300000, batch_size: 256, gamma: 0.99, tau: 0.005, train_freq: 4, gradient_steps: 1, learning_starts: 5000, ent_coef: auto, device: auto, checkpoint_interval: 20000}
evaluation: {deterministic: true, validation_days: 92, test_days: 92, initial_soc: 0.55}

